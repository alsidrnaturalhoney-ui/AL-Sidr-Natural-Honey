name: JARVIS Core Validate

on:
  push:
    paths:
      - 'packages/jarvis-core/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/jarvis-core-validate.yml'
  pull_request:
    paths:
      - 'packages/jarvis-core/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/jarvis-core-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Use the committed lockfile for reproducible CI installs.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
