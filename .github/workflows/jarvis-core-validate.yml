name: JARVIS Core Validate

on:
  push:
    paths:
      - 'packages/jarvis-core/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/jarvis-core-validate.yml'
  pull_request:
    paths:
      - 'packages/jarvis-core/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/jarvis-core-validate.yml'

permissions:
  contents: read

timeout-minutes: 10

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No package-lock.json is present, so install from package manifests.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
